name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Functional, full load, parallel run and Postman
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: comp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG: postgresql+psycopg://qa:qa@localhost:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Functional suite on SQLite
        run: pytest --junitxml=reports/ci/pytest-functional.xml

      - name: Functional suite on PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/comp_test
        run: pytest --junitxml=reports/ci/pytest-functional-postgres.xml

      - name: Full-volume load, parallel run against the oracle, SQL invariants
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/comp_test
        run: pytest -m fullload --junitxml=reports/ci/pytest-fullload-postgres.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Postman collection with Newman on PostgreSQL
        run: |
          PGPASSWORD=qa psql -h localhost -U qa -d comp_test -c "CREATE DATABASE comp_api;"
          scripts/run_newman.sh ci "$PG/comp_api"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: reports/ci

  oracle:
    name: Dataset and Excel oracle are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pip install openpyxl==3.1.5
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc

      - name: Regenerate the dataset and compare with the committed one
        run: |
          python data/generate.py
          git diff --exit-code data/generated

      - name: Rebuild and recalculate the oracle, compare its results
        run: |
          python oracle/build_oracle.py
          python oracle/recalc.py oracle/commission_oracle.xlsx 900
          python oracle/extract.py
          git diff --exit-code oracle/oracle_payouts.csv oracle/oracle_summary.json

  mutation:
    name: Seeded-fault check (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/mutation_check.py --label ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/ci/mutation.json
