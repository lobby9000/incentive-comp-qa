# Optional local PostgreSQL 16, same version as CI.
# Start: docker compose up -d db   URL: postgresql+psycopg://qa:qa@localhost:5432/comp_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: comp_test
    ports:
      - "5432:5432"
